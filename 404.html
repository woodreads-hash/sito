<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,follow"/>
<title>404 — Pagina non trovata | WooDreads</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"/>
<link rel="shortcut icon" href="/favicon.ico"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<style>
  :root{--dark:#0D0D0F;--dark2:#111116;--green:#8CFF00;--purple:#B58CFF;--text:#F5F5F7;--muted:rgba(245,245,247,.55);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--dark);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;position:relative;overflow:hidden;}
  body::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 400px at 20% 10%,rgba(181,140,255,.16),transparent 70%),radial-gradient(500px 400px at 85% 85%,rgba(140,255,0,.10),transparent 70%);pointer-events:none;}
  .wrap{position:relative;text-align:center;max-width:640px;}
  .code{font-size:clamp(5rem,22vw,11rem);line-height:.9;font-weight:900;letter-spacing:-2px;color:transparent;-webkit-text-stroke:2px var(--purple);text-shadow:0 0 34px rgba(181,140,255,.35);}
  .glitch{position:relative;animation:gl 3.4s infinite;}
  .glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;overflow:hidden;}
  .glitch::before{color:var(--green);transform:translate(2px,-1px);clip-path:inset(12% 0 62% 0);animation:gl1 3.4s infinite;}
  .glitch::after{color:var(--purple);transform:translate(-2px,1px);clip-path:inset(58% 0 14% 0);animation:gl2 3.4s infinite;}
  @keyframes gl{0%,92%,100%{transform:none;}93%{transform:translate(-3px,1px);}96%{transform:translate(3px,-1px);}}
  @keyframes gl1{0%,92%,100%{transform:none;}93%{transform:translate(3px,-2px);}96%{transform:translate(-3px,1px);}}
  @keyframes gl2{0%,92%,100%{transform:none;}94%{transform:translate(-3px,2px);}97%{transform:translate(2px,-1px);}}
  h1{margin:1.2rem 0 .6rem;font-size:clamp(1.4rem,4vw,2.2rem);letter-spacing:2px;text-transform:uppercase;}
  p{color:var(--muted);line-height:1.7;margin-bottom:2rem;}
  .actions{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 1.9rem;border-radius:6px;font-weight:700;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;text-decoration:none;border:1.5px solid transparent;transition:transform .2s,box-shadow .2s,background .2s;}
  .btn:hover{transform:translateY(-2px);}
  .btn-g{background:var(--green);color:var(--dark);box-shadow:0 0 25px rgba(140,255,0,.25);}
  .btn-v{background:var(--dark2);border-color:var(--purple);color:var(--purple);box-shadow:0 0 18px rgba(181,140,255,.25);}
  .brand{margin-top:3rem;font-size:.78rem;letter-spacing:4px;color:rgba(245,245,247,.35);text-transform:uppercase;}
  .brand em{color:var(--green);font-style:normal;}
</style>
</head>
<body>
  <main class="wrap">
    <div class="code glitch" data-text="404">404</div>
    <h1>Pagina non trovata</h1>
    <p>Questa pagina non esiste o è stata spostata. L'URL che hai seguito è scomparso nel flusso.<br/>Torna alla home o sfoglia il blog per continuare.</p>
    <div class="actions">
      <a class="btn btn-g" href="/index.html">← Torna alla home</a>
      <a class="btn btn-v" href="/blog">Leggi il blog</a>
    </div>
    <p class="brand">WOO<em>DREADS</em> — Roma &amp; Provincia</p>
  </main>
</body>
</html>
