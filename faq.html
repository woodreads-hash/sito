<style>
:root{color-scheme:only light;--green:#8CFF00;--purple:#B58CFF;--lime:#E6FF4D;--dark:#0D0D0F;--dark2:#111116;--mid:#1E1E24;--cream:#F7F4EE;--text-d:#F5F5F7;--text-l:#1A1A1E;--muted-d:rgba(245,245,247,.58);--leaf1:#2D5A27;--fd:'Orbitron',sans-serif;--fb:'Exo 2',sans-serif;}

body{background:var(--dark);color:var(--text-d);font-family:var(--fb);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative;}

.eyebrow{color:var(--purple);font-size:.68rem;letter-spacing:4px;text-transform:uppercase;font-weight:700;display:block;margin-bottom:.55rem;}

.faq-detail{background:linear-gradient(145deg,rgba(29,20,42,.78),rgba(13,13,15,.92));border:1px solid rgba(181,140,255,.26);border-radius:18px;padding:1.5rem;box-shadow:0 24px 70px -34px rgba(0,0,0,.9);position:relative;overflow:hidden;}
.faq-detail::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(181,140,255,.08) 0px,rgba(140,255,0,.03) 1px,transparent 2px,transparent 5px);mix-blend-mode:screen;opacity:.35;}

.cat{display:inline-flex;align-items:center;gap:.35rem;color:var(--purple);font-size:.62rem;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;margin-bottom:.7rem;}

.cta-btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;background:var(--green);color:var(--dark);border-radius:7px;padding:.7rem 1.1rem;font-weight:800;font-size:.68rem;letter-spacing:1.6px;text-transform:uppercase;white-space:nowrap;transition:background .2s,box-shadow .2s;}
.cta-btn:hover{background:var(--lime);box-shadow:0 0 24px rgba(140,255,0,.4);}
.related{margin-top:2rem;}
.related h2{font-family:var(--fd);font-size:.82rem;letter-spacing:2px;text-transform:uppercase;color:var(--purple);margin-bottom:.8rem;}
.related-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;}
.related-card{display:block;padding:.9rem 1rem;border:1px solid rgba(181,140,255,.22);border-radius:12px;background:rgba(245,245,247,.025);transition:border-color .2s,background .2s,transform .2s;}
.related-card:hover{border-color:rgba(140,255,0,.45);background:rgba(140,255,0,.045);transform:translateY(-2px);}

.related-card .rc-q{font-size:.82rem;line-height:1.45;color:rgba(245,245,247,.82);}
.faq-index{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin-top:1.2rem;}
.faq-index-card{display:block;padding:1rem;border:1px solid rgba(181,140,255,.2);border-radius:13px;background:linear-gradient(145deg,rgba(30,30,36,.88),rgba(13,13,15,.92));transition:border-color .2s,transform .2s,box-shadow .2s;}
.faq-index-card:hover{border-color:rgba(140,255,0,.5);transform:translateY(-2px);box-shadow:0 14px 32px -24px rgba(140,255,0,.55);}
.faq-index-card .fc-cat{font-size:.52rem;letter-spacing:1.8px;text-transform:uppercase;font-weight:700;color:var(--purple);display:block;margin-bottom:.3rem;}
.faq-index-card .fc-q{font-size:.85rem;line-height:1.45;color:rgba(245,245,247,.85);}
.loading,.error-box{padding:2.5rem 1rem;text-align:center;color:var(--muted-d);}
.error-box h1{font-size:1.6rem;margin-bottom:.5rem;}
.error-box p{font-size:.9rem;margin-bottom:1rem;}
.back-link{display:inline-flex;padding:.7rem 1rem;border:1px solid rgba(140,255,0,.35);border-radius:8px;color:var(--green);font-size:.7rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;background:rgba(140,255,0,.05);}
.back-link:hover{background:var(--green);color:var(--dark);}
footer{border-top:1px solid rgba(255,255,255,.06);padding:2rem 0;color:var(--muted-d);font-size:.8rem;text-align:center;position:relative;z-index:1;}
footer a{color:var(--green);}
footer a:hover{color:var(--lime);}
footer .legal-links{display:flex;gap:1rem;justify-content:center;margin-top:.5rem;flex-wrap:wrap;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;}
@media(max-width:760px){
  nav{padding:.75rem 1rem;}
  .related-grid,.faq-index{grid-template-columns:1fr;}
  .faq-detail{padding:1.15rem;}
  .answer{font-size:.94rem;line-height:1.82;}
  .cta-box{align-items:flex-start;}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto;}.related-card,.faq-index-card,.share-btn{transition:none;}}
</style>

<script>
(function(){
  const DEFAULT_IMAGE = 'https://www.woodreads.com/og-default.jpg';
  const page = document.getElementById('faq-page');
  const breadcrumb = document.getElementById('breadcrumb');
  const params = new URLSearchParams(location.search);
  const pathMatch = location.pathname.match(/^\/faq\/([^/]+)\/?$/);
  const requested = (pathMatch ? pathMatch[1] : '') || params.get('slug') || '';
  let requestedSlug = requested;
  try { requestedSlug = requested ? decodeURIComponent(requested) : ''; } catch (e) { requestedSlug = requested; }

  function escapeHtml(value){
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(c){
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
    });
  }
  function nl2br(value){ return escapeHtml(value).replace(/\r?\n/g, '<br>'); }
  function slugFor(faq){ return window.WD_FAQ_SLUG ? window.WD_FAQ_SLUG(faq.question, faq.id) : String(faq.id || ''); }
  function pathFor(faq){ return '/faq/' + slugFor(faq); }
  function urlFor(faq){ return location.origin + pathFor(faq); }
  function stripHtml(value){ return String(value || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); }
  function truncate(value, max){ var text = stripHtml(value); return text.length > max ? text.slice(0, max - 1).trim() + '…' : text; }
  function setMeta(name, content, attr){
    attr = attr || 'name';
    if (!content) return;
    let el = document.querySelector('meta[' + attr + '="' + name + '"]');
    if (!el) { el = document.createElement('meta'); el.setAttribute(attr, name); document.head.appendChild(el); }
    el.setAttribute('content', content);
  }
  function setCanonical(url){
    let link = document.querySelector('link[rel="canonical"]');
    if (!link) { link = document.createElement('link'); link.rel = 'canonical'; document.head.appendChild(link); }
    link.setAttribute('href', url);
  }
  function injectJsonLd(items){
    let script = document.getElementById('jsonld-faq');
    if (!script) { script = document.createElement('script'); script.type = 'application/ld+json'; script.id = 'jsonld-faq'; document.head.appendChild(script); }
    script.textContent = JSON.stringify({
      '@context':'https://schema.org',
      '@type':'FAQPage',
      mainEntity: items.map(function(faq){
        return {
          '@type':'Question',
          name: faq.question,
          acceptedAnswer: { '@type':'Answer', text: stripHtml(faq.answer) }
        };
      })
    });
  }
  function normalize(faq){
    return {
      id: String(faq.id || ('faq_' + Math.random().toString(36).slice(2, 10))),
      question: String(faq.question != null ? faq.question : (faq.q || '')),
      answer: String(faq.answer != null ? faq.answer : (faq.a || '')),
      category: String(faq.category != null ? faq.category : (faq.cat || '')),
      sort_order: Number(faq.sort_order || 0),
      published: faq.published !== false
    };
  }
  function defaults(){
    return (window.WD_DEFAULT_FAQS || []).map(function(faq, index){
      return normalize({ id: faq.id, question: faq.q, answer: faq.a, category: faq.cat, sort_order: index + 1, published: true });
    });
  }
  function readLocal(){
    try {
      const value = JSON.parse(localStorage.getItem('wd_faqs') || 'null');
      return Array.isArray(value) ? value.map(normalize) : null;
    } catch (e) { return null; }
  }
  function sortFaqs(list){
    return list.slice().sort(function(a, b){
      const diff = (a.sort_order || 0) - (b.sort_order || 0);
      return diff || String(a.id).localeCompare(String(b.id));
    });
  }
  async function loadFaqs(){
    if (window.supabaseGetFaqs) {
      try {
        const rows = await window.supabaseGetFaqs();
        if (Array.isArray(rows) && rows.length) return sortFaqs(rows.map(normalize).filter(function(faq){ return faq.published !== false; }));
      } catch (e) {}
    }
    const local = readLocal();
    if (local && local.length) return sortFaqs(local.filter(function(faq){ return faq.published !== false; }));
    return sortFaqs(defaults());
  }
  function shareText(faq){ return faq.question + '\n\n' + urlFor(faq); }
  function trackShare(faq){
    if (window.supabaseTrackFaq) Promise.resolve(window.supabaseTrackFaq(faq.id, { shares: 1 })).catch(function(){});
  }
  function fallbackCopy(text){
    try {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(area);
      return ok;
    } catch (e) { return false; }
  }
  function copyText(text, btn){
    const done = function(ok){
      if (!btn) return;
      if (!btn.dataset.label) btn.dataset.label = btn.textContent;
      btn.textContent = ok ? 'Copiato ✓' : 'Copia manuale';
      btn.classList.add('share-done');
      setTimeout(function(){ btn.textContent = btn.dataset.label; btn.classList.remove('share-done'); }, 1700);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ done(fallbackCopy(text)); });
    } else {
      done(fallbackCopy(text));
    }
  }
  function bindShare(faq){
    const row = document.getElementById('faq-share-row');
    if (!row) return;
    row.addEventListener('click', function(ev){
      const btn = ev.target.closest('[data-share]');
      if (!btn) return;
      const kind = btn.dataset.share;
      if (kind === 'copy') { copyText(urlFor(faq), btn); return; }
      const url = urlFor(faq);
      if (kind === 'whatsapp') {
        window.open('https://wa.me/?text=' + encodeURIComponent(shareText(faq)), '_blank', 'noopener');
      } else if (kind === 'telegram') {
        window.open('https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(faq.question), '_blank', 'noopener');
      }
      trackShare(faq);
    });
  }
  function renderIndex(faqs){
    document.title = 'FAQ — WooDreads | Domande frequenti sui dreads';
    setMeta('description', 'Le risposte alle domande più frequenti su dreads, manutenzione, cyberdread, prezzi e cura.');
    setMeta('og:title', 'FAQ — WooDreads | Domande frequenti sui dreads', 'property');
    setMeta('og:description', 'Le risposte alle domande più frequenti su dreads, manutenzione, cyberdread, prezzi e cura.', 'property');
    setMeta('og:url', 'https://www.woodreads.com/faq', 'property');
    setMeta('og:type', 'website', 'property');
    setMeta('og:image', DEFAULT_IMAGE, 'property');
    setMeta('twitter:title', 'FAQ — WooDreads | Domande frequenti sui dreads');
    setMeta('twitter:description', 'Le risposte alle domande più frequenti su dreads, manutenzione, cyberdread, prezzi e cura.');
    setMeta('twitter:image', DEFAULT_IMAGE);
    setCanonical('https://www.woodreads.com/faq');
    injectJsonLd(faqs);
    breadcrumb.innerHTML = '<a href="/index.html">Home</a><span class="sep">/</span><a href="/faq">FAQ</a>';
    page.innerHTML = '<header class="page-head">' +
      '<span class="eyebrow">— Domande frequenti</span>' +
      '<h1>Tutto sui <em>dreads</em></h1>' +
      '<p class="lead">Le ' + faqs.length + ' domande che ci fate più spesso, con risposte vere e senza giri di parole. Apri una domanda per leggere la pagina dedicata e condividerla con chi ne ha bisogno.</p>' +
      '</header>' +
      '<div class="faq-index">' + faqs.map(function(faq){
        return '<a class="faq-index-card" href="' + escapeHtml(pathFor(faq)) + '">' +
          (faq.category ? '<span class="fc-cat">' + escapeHtml(faq.category) + '</span>' : '') +
          '<span class="fc-q">' + escapeHtml(faq.question) + '</span>' +
        '</a>';
      }).join('') + '</div>';
  }
  function renderDetail(faq, faqs){
    const url = urlFor(faq);
    const description = truncate(faq.answer, 190);
    document.title = faq.question + ' — FAQ WooDreads';
    setMeta('description', description);
    setMeta('og:type', 'article', 'property');
    setMeta('og:title', faq.question, 'property');
    setMeta('og:description', description, 'property');
    setMeta('og:url', url, 'property');
    setMeta('og:image', DEFAULT_IMAGE, 'property');
    setMeta('og:image:alt', faq.question, 'property');
    setMeta('article:section', faq.category || 'FAQ', 'property');
    setMeta('twitter:title', faq.question);
    setMeta('twitter:description', description);
    setMeta('twitter:image', DEFAULT_IMAGE);
    setCanonical(url);
    injectJsonLd([faq]);
    breadcrumb.innerHTML = '<a href="/index.html">Home</a><span class="sep">/</span><a href="/faq">FAQ</a><span class="sep">/</span><span>' + escapeHtml(faq.question) + '</span>';
    const related = faqs.filter(function(item){ return item.id !== faq.id && item.category === faq.category; })
      .concat(faqs.filter(function(item){ return item.id !== faq.id && item.category !== faq.category; }))
      .slice(0, 4);
    page.innerHTML = '<article class="faq-detail">' +
      (faq.category ? '<span class="cat">' + escapeHtml(faq.category) + '</span>' : '') +
      '<h1>' + escapeHtml(faq.question) + '</h1>' +
      '<div class="answer">' + nl2br(faq.answer).split('<br><br>').map(function(part){ return '<p>' + part.replace(/<br>/g, '<br>') + '</p>'; }).join('') + '</div>' +
      '<div class="share-row" id="faq-share-row" aria-label="Condividi questa FAQ">' +
        '<span class="share-label">Condividi</span>' +
        '<button type="button" class="share-btn share-wa" data-share="whatsapp">WhatsApp</button>' +
        '<button type="button" class="share-btn share-tg" data-share="telegram">Telegram</button>' +
        '<button type="button" class="share-btn share-copy" data-share="copy">Copia link</button>' +
      '</div>' +
      '<div class="cta-box"><p>Vuoi parlare direttamente con noi di questa domanda o prenotare una consulenza?</p><a class="cta-btn" href="https://wa.me/393485393826?text=' + encodeURIComponent('Ciao WooDreads, ho letto la FAQ "' + faq.question + '" e vorrei una consulenza.') + '" target="_blank" rel="noopener">💬 Scrivici su WhatsApp</a></div>' +
      (related.length ? '<section class="related"><h2>Altre domande</h2><div class="related-grid">' + related.map(function(item){
        return '<a class="related-card" href="' + escapeHtml(pathFor(item)) + '"><span class="rc-cat">' + escapeHtml(item.category || 'FAQ') + '</span><span class="rc-q">' + escapeHtml(item.question) + '</span></a>';
      }).join('') + '</div></section>' : '') +
      '</article>';
    bindShare(faq);
  }
  function renderNotFound(){
    document.title = 'FAQ non trovata — WooDreads';
    setMeta('robots', 'noindex, follow');
    breadcrumb.innerHTML = '<a href="/index.html">Home</a><span class="sep">/</span><a href="/faq">FAQ</a><span class="sep">/</span><span>Non trovata</span>';
    page.innerHTML = '<div class="error-box"><h1>FAQ non trovata</h1><p>Questa domanda non esiste o è stata spostata. Puoi consultare tutte le FAQ disponibili.</p><a class="back-link" href="/faq">← Torna alle FAQ</a></div>';
  }
  loadFaqs().then(function(faqs){
    if (!requestedSlug) { renderIndex(faqs); return; }
    const found = faqs.find(function(faq){ return slugFor(faq) === requestedSlug || faq.id === requestedSlug; });
    if (found) renderDetail(found, faqs); else renderNotFound();
  }).catch(function(){
    page.innerHTML = '<div class="error-box"><h1>FAQ non disponibili</h1><p>Riprova più tardi o consulta le domande nella home.</p><a class="back-link" href="/index.html#faq">← Vai alle FAQ</a></div>';
  });
})();
</script>
<script src="cookie-consent.js" defer></script>
</body>
</html>
