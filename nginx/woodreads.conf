# WooDreads — Nginx config
# Symlink to: /etc/nginx/sites-available/woodreads.conf
# Enable:    ln -s /etc/nginx/sites-available/woodreads.conf /etc/nginx/sites-enabled/
# Test:      nginx -t
# Reload:    systemctl reload nginx

server {
    listen 80;
    server_name woodreads.it www.woodreads.it;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name woodreads.it www.woodreads.it;

    # ── SSL (managed by certbot) ──
    ssl_certificate     /etc/letsencrypt/live/woodreads.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woodreads.it/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── API Gateway (replaces Netlify functions) ──
    location ~ ^/\.netlify/functions/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Strapi Admin (restricted in location, NOT in application) ──
    # Users without a valid IP will get 403 at the Nginx level.
    # Uncomment and adjust the allow/deny lines to restrict /admin by IP:
    #
    # location ^~ /admin {
    #     allow  YOUR.HOME.IP.ADDRESS;
    #     allow  YOUR.VPN.IP.ADDRESS;
    #     deny   all;
    #     proxy_pass http://127.0.0.1:1337;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    #
    # If you prefer Strapi Admin on a custom subpath (replaces default /admin):
    # location /secret-admin-path {
    #     proxy_pass http://127.0.0.1:1337/admin;
    #     ...
    # }
    # And in Strapi config/admin.js set admin.url and admin.path.

    # ── Strapi API (media uploads, direct queries) ──
    location /api/ {
        proxy_pass http://127.0.0.1:1337/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Strapi Uploads (served as static for performance) ──
    location /uploads/ {
        alias /opt/woodreads/cms/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Static frontend ──
    root /var/www/woodreads;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # ── Asset caching (CSS/JS/fonts) ──
    location ~* \.(css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Deny hidden files ──
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Logs ──
    access_log /var/log/nginx/woodreads-access.log;
    error_log  /var/log/nginx/woodreads-error.log;
}
