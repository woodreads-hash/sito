# Rate limiting — include in Nginx http block
# Add to /etc/nginx/nginx.conf inside the http { } block:
#
#   include /etc/nginx/rate-limit.conf;

limit_req_zone $binary_remote_addr zone=appt_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
