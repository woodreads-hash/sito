:root{color-scheme:only light;--green:#8CFF00;--purple:#B58CFF;--lime:#E6FF4D;--dark:#0D0D0F;--dark2:#111116;--mid:#1E1E24;--cream:#F7F4EE;--text-d:#F5F5F7;--text-l:#1A1A1E;--muted-d:rgba(245,245,247,.6);--fd:'Orbitron',sans-serif;--fb:'Exo 2',sans-serif;}

.nlogo{font-family:var(--fd);font-size:.85rem;letter-spacing:3px;}
.nlogo em{color:var(--green);font-style:normal;}
nav ul{list-style:none;display:flex;gap:1.2rem;font-size:.7rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;}
nav a:hover{color:var(--green);}
.breadcrumb{font-size:.7rem;color:var(--muted-d);margin:1.2rem 0 .6rem;letter-spacing:1px;}

.article-header{padding:1.5rem 0 1rem;}
.cat{color:var(--purple);font-size:.7rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;}

.meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:.75rem;color:var(--muted-d);margin-bottom:1.2rem;}
article .content{font-size:1rem;}
article .content h1{font-family:var(--fd);font-size:1.8rem;margin:2.2rem 0 .8rem;color:var(--green);line-height:1.2;}
article .content h2{font-family:var(--fd);font-size:1.5rem;margin:2rem 0 .8rem;color:var(--green);}
article .content h3{font-size:1.2rem;margin:1.6rem 0 .6rem;color:var(--purple);}
article .content p{margin:.8rem 0;color:var(--text-d);}
article .content a{color:var(--green);text-decoration:underline;}
article .content ul,article .content ol{margin:.8rem 0 1rem 1.4rem;}
article .content img,article .content video{max-width:100%;border-radius:12px;margin:1rem 0;}
article .content iframe{max-width:100%;border:0;border-radius:12px;}

article .content code{background:var(--mid);padding:.15rem .4rem;border-radius:4px;font-size:.9rem;}

.article-media-list{display:flex;flex-direction:column;gap:1rem;}
.article-media-list img,.article-media-list video{width:100%;max-height:560px;object-fit:contain;border-radius:16px;display:block;background:var(--dark2);}
.article-media-list iframe{width:100%;aspect-ratio:16/9;height:auto;border:0;border-radius:16px;display:block;background:var(--dark2);}
.article-media-list figure{margin:0;}
.article-media-list figcaption{font-size:.75rem;color:var(--muted-d);margin-top:.45rem;}
.video-frame{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:16px;background:var(--dark2);}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.article-share{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin:1.6rem 0 .5rem;padding:1rem 0;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);}
.share-label{font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted-d);font-weight:700;margin-right:.2rem;}
.share-btn{border:1px solid rgba(140,255,0,.35);background:rgba(140,255,0,.06);color:var(--green);border-radius:999px;padding:.55rem 1rem;font-family:var(--fb);font-size:.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.2s;}
.share-btn:hover{background:var(--green);color:var(--dark);}
.share-copy{border-color:rgba(181,140,255,.35);background:rgba(181,140,255,.06);color:var(--purple);}
.share-copy:hover{background:var(--purple);color:var(--dark);}
.share-done{background:var(--green)!important;color:var(--dark)!important;border-color:var(--green)!important;}
.tags{display:flex;gap:.4rem;flex-wrap:wrap;margin:1.5rem 0;}
.tag{padding:.3rem .7rem;border-radius:999px;border:1px solid rgba(181,140,255,.3);font-size:.7rem;color:var(--purple);}
.loading,.error{padding:3rem 1rem;text-align:center;color:var(--muted-d);}

.article-nav{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:space-between;margin-top:2.2rem;padding-top:1.2rem;border-top:1px solid rgba(255,255,255,.08);}
.nav-btn{padding:.75rem 1rem;border-radius:10px;border:1px solid rgba(140,255,0,.3);color:var(--green);font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:.75rem;transition:.2s;background:rgba(140,255,0,.05);}
.nav-btn:hover{background:var(--green);color:var(--dark);}
.nav-btn.next{border-color:rgba(181,140,255,.35);color:var(--purple);background:rgba(181,140,255,.05);}
.nav-btn.next:hover{background:var(--purple);color:var(--dark);}
.nav-btn.game{border-color:rgba(140,255,0,.45);color:var(--green);background:rgba(140,255,0,.08);}
.nav-btn.game:hover{background:var(--green);color:var(--dark);}

footer{border-top:1px solid rgba(255,255,255,.06);padding:2rem 0;color:var(--muted-d);font-size:.8rem;text-align:center;}
footer a{color:var(--green);}
footer a:hover{color:var(--lime);}
footer .legal-links{display:flex;gap:1rem;justify-content:center;margin-top:.5rem;flex-wrap:wrap;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;}
@media(max-width:640px){h1{font-size:1.8rem;}}

.particle{position:absolute;border-radius:50%;pointer-events:none;animation:particlefloat linear infinite;}
nav,main,.wrap,footer,.article-nav,.article-header{position:relative;z-index:2;}

<script>
const wrap = document.getElementById('wrap');
const params = new URLSearchParams(location.search);
const slug = params.get('slug');
let blogTrack = { id: null, start: 0, sent: false };

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function formatDate(iso){try{return new Date(iso).toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});}catch(e){return '';}}
function setMeta(name,content,attr='name'){
  if(!content) return;
  let el = document.querySelector('meta['+attr+'="'+name+'"]');
  if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}
function injectJsonLd(obj){
  let s = document.getElementById('jsonld-article');
  if(!s){s=document.createElement('script');s.type='application/ld+json';s.id='jsonld-article';document.head.appendChild(s);}
  s.textContent = JSON.stringify(obj);
}

function sanitizeHtml(html){
  if(window.WD_BLOG) return window.WD_BLOG.sanitizeHtml(html);
  return String(html||'').replace(/<script[\s\S]*?<\/script>/gi,'').replace(/on\w+\s*=\s*(".*?"|'.*?'|[^\s>]+)/gi,'').replace(/javascript:/gi,'');
}

function mapSupabasePost(row){
  return {
    id: row.id,
    slug: row.slug,
    title: row.title,
    excerpt: row.excerpt || (row.text || '').replace(/<[^>]+>/g,'').slice(0,240),
    category: row.category ? {name: row.category} : null,
    coverImage: row.cover_url ? {url: row.cover_url} : null,
    publishedAt: row.created_at,
    updatedAt: row.updated_at,
    readingTime: row.reading_time || 5,
    content: row.text || '',
    videoUrl: row.video_url || row.video_name || '',
    youtube: row.youtube || ''
  };
}

function extractArticleMedia(html){
  const container = document.createElement('div');
  container.innerHTML = sanitizeHtml(html || '');
  const media = [];
  Array.prototype.slice.call(container.querySelectorAll('iframe, video, img')).forEach(function(node){
    if(node.tagName.toLowerCase() === 'img' && !window.WD_BLOG.isGifUrl(node.getAttribute('src') || '')) return;
    let target = node;
    const figure = node.closest('figure');
    const link = node.closest('a');
    if(figure && figure.querySelectorAll('img, video, iframe').length === 1){
      target = figure;
    } else if(link && link.querySelectorAll('img, video, iframe').length === 1 && !link.textContent.trim()){
      target = link;
    }
    if(target.parentNode){
      target.parentNode.removeChild(target);
      media.push(target);
    }
  });
  Array.prototype.slice.call(container.querySelectorAll('p, div, figure')).forEach(function(el){
    if(el.querySelector('img, video, iframe')) return;
    if(el.textContent.trim()) return;
    if(el.querySelector('br, hr')) return;
    if(!el.children.length) el.remove();
  });
  return {
    html: container.innerHTML,
    mediaHtml: media.map(function(node){ return node.outerHTML; }).join('')
  };
}

function articleMediaBlock(post, inlineHtml){
  const parts = [];
  if(inlineHtml) parts.push(inlineHtml);
  if(post.videoUrl){
    const isVideo = window.WD_BLOG.isVideoUrl(post.videoUrl) && !window.WD_BLOG.isGifUrl(post.videoUrl);
    parts.push(isVideo
      ? '<video src="' + esc(post.videoUrl) + '" controls autoplay loop muted playsinline></video>'
      : '<img src="' + esc(post.videoUrl) + '" alt="' + esc(post.title) + '" loading="lazy"/>');
  }
  if(post.youtube){
    const embed = window.WD_BLOG.youtubeEmbed(post.youtube);
    if(embed){
      parts.push('<div class="video-frame"><iframe src="' + esc(embed) + '" title="Video YouTube" loading="lazy" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>');
    }
  }
  if(!parts.length) return '';
  return '<section class="article-media" aria-label="Video e GIF">'+
    '<h2>🎬 Video e GIF</h2>'+
    '<div class="article-media-list">'+parts.join('')+'</div>'+
  '</section>';
}

function fallbackCopy(text){
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e){ return false; }
}

function copyText(text, btn){
  const done = function(ok){
    if(!btn) return;
    if(!btn.dataset.label) btn.dataset.label = btn.textContent;
    btn.textContent = ok ? 'Copiato ✓' : 'Copia manuale';
    btn.classList.add('share-done');
    setTimeout(function(){
      btn.textContent = btn.dataset.label;
      btn.classList.remove('share-done');
    }, 1700);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ done(fallbackCopy(text)); });
  } else {
    done(fallbackCopy(text));
  }
}

function bindShare(url, title){
  const bar = wrap.querySelector('.article-share');
  if(!bar) return;
  bar.addEventListener('click', function(e){
    const btn = e.target.closest('[data-share]');
    if(!btn) return;
    if(btn.dataset.share === 'copy'){ copyText(url, btn); return; }
    if(btn.dataset.share === 'whatsapp'){
      const text = title + '\n\n' + url;
      try { window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener'); } catch(e){}
    }
  });
}

function startBlogTracking(post){
  if(!post || !post.id || params.get('preview') === '1') return;
  blogTrack.id = post.id;
  blogTrack.start = Date.now();
  if(window.supabaseTrackBlogView){
    Promise.resolve(window.supabaseTrackBlogView(post.id)).catch(function(){});
  }
}

function sendBlogTime(){
  if(!blogTrack.id || blogTrack.sent) return;
  const seconds = Math.round((Date.now() - blogTrack.start) / 1000);
  if(seconds < 2) return;
  blogTrack.sent = true;
  if(window.supabaseTrackBlogTime) window.supabaseTrackBlogTime(blogTrack.id, seconds);
}

window.addEventListener('pagehide', sendBlogTime);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden') sendBlogTime();
});

function renderPost(post, nextPost){
  if(!post){
    wrap.innerHTML='<div class="error">Articolo non trovato.</div>';return;
  }
  try{
    const title = post.seoTitle || post.title;
    const description = post.seoDescription || post.excerpt || '';
    const cover = post.coverImage ? post.coverImage.url : '';
    const category = post.category ? post.category.name : '';
    const tags = (post.tags||[]).map(function(t){ return t.name||t; }).filter(Boolean);
    const published = post.publishedAt || post.createdAt;
    const modified = post.updatedAt || published;
    const url = location.origin + location.pathname + '?slug=' + encodeURIComponent(slug);
    const author = post.authorName || 'WooDreads';

    document.title = title + ' — Blog WooDreads';
    setMeta('description', description);
    setMeta('og:title', title, 'property');
    setMeta('og:description', description, 'property');
    setMeta('og:url', url, 'property');
    setMeta('og:image', cover, 'property');
    setMeta('og:type', 'article', 'property');
    setMeta('article:published_time', published, 'property');
    setMeta('article:modified_time', modified, 'property');
    setMeta('article:author', author, 'property');
    if(category) setMeta('article:section', category, 'property');
    setMeta('twitter:title', title);
    setMeta('twitter:description', description);
    setMeta('twitter:image', cover);
    const canonical = document.querySelector('link[rel="canonical"]');
    if(canonical) canonical.setAttribute('href', url);
    document.getElementById('bc-title').textContent = post.title;

    const body = extractArticleMedia(post.content || '');
    const mediaSection = articleMediaBlock(post, body.mediaHtml);

    const jsonLd = {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": post.title,
      "description": description,
      "image": cover ? [cover] : undefined,
      "author": {"@type":"Person","name":author},
      "publisher": {"@type":"Organization","name":"WooDreads","logo":{"@type":"ImageObject","url":location.origin+"/logo.svg"}},
      "datePublished": published,
      "dateModified": modified,
      "mainEntityOfPage": {"@type":"WebPage","@id":url},
      "articleSection": category || undefined,
      "keywords": tags.length ? tags.join(', ') : undefined,
      "wordCount": (post.content||'').replace(/<[^>]+>/g,'').split(/\s+/).length
    };
    Object.keys(jsonLd).forEach(function(k){ if(jsonLd[k]===undefined) delete jsonLd[k]; });

    wrap.innerHTML =
      '<article>'+
      '<header class="article-header">'+
      (category?'<div class="cat">'+esc(category)+'</div>':'')+
      '<h1>'+esc(post.title)+'</h1>'+
      '<div class="meta"><span>'+formatDate(published)+'</span><span>'+esc(author)+'</span>'+(post.readingTime?'<span>'+post.readingTime+' min lettura</span>':'')+'</div>'+
      '</header>'+
      '<section class="content">'+body.html+'</section>'+
      mediaSection+
      (tags.length?'<div class="tags">'+tags.map(function(t){ return '<span class="tag">#'+esc(t)+'</span>'; }).join('')+'</div>':'')+
      '<div class="article-share" aria-label="Condividi articolo">'+
        '<span class="share-label">Condividi</span>'+
        '<button type="button" class="share-btn share-wa" data-share="whatsapp">WhatsApp</button>'+
        '<button type="button" class="share-btn share-copy" data-share="copy">Copia link</button>'+
      '</div>'+
      '<nav class="article-nav" aria-label="Navigazione articoli">'+
      '<a class="nav-btn" href="blog.html">← Torna al blog</a>'+
      '<a class="nav-btn game" href="index.html#quiz">🎮 Mini-Game</a>'+
      (nextPost ? '<a class="nav-btn next" href="blog-post.html?slug='+encodeURIComponent(nextPost.slug)+'" aria-label="Prossimo articolo: '+esc(nextPost.title)+'">Prossimo articolo →</a>' : '')+
      '</nav>'+
      '</article>';

    injectJsonLd(jsonLd);
    bindShare(url, post.title);
    startBlogTracking(post);
  }catch(e){
    wrap.innerHTML='<div class="error">Errore nel caricamento dell\'articolo. Riprova più tardi.</div>';
  }
}

function findNextPublishedPost(rows, current){
  const list = rows || [];
  const index = list.findIndex(function(row){ return row.id === current.id || row.slug === current.slug; });
  return index >= 0 ? (list[index + 1] || null) : null;
}

async function render(){
  if(!slug){
    wrap.innerHTML='<div class="error">Slug articolo mancante.</div>';return;
  }
  try{
    if(!window.supabaseGetBlogPostBySlug) throw new Error('Supabase non disponibile');
    const results = await Promise.all([
      window.supabaseGetBlogPostBySlug(slug),
      window.supabaseGetBlogPosts ? window.supabaseGetBlogPosts({ status:'published', limit:300 }).catch(function(){ return []; }) : Promise.resolve([])
    ]);
    const row = results[0];
    if(!row){ wrap.innerHTML='<div class="error">Articolo non trovato.</div>'; return; }
    const nextRow = findNextPublishedPost(results[1] || [], row);
    renderPost(mapSupabasePost(row), nextRow ? mapSupabasePost(nextRow) : null);
  }catch(e){
    wrap.innerHTML='<div class="error">Errore nel caricamento dell\'articolo. Riprova più tardi.</div>';
  }
}

render();

const purpleCols = ['rgba(181,140,255,.9)','rgba(255,107,241,.85)','rgba(230,180,255,.75)','rgba(181,140,255,.55)','rgba(255,255,255,.4)'];
function makePurpleParticles(containerId,count){
  const c=document.getElementById(containerId); if(!c) return;
  c.style.cssText='position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;';
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    const size=Math.random()*5+2;
    const col=purpleCols[Math.floor(Math.random()*purpleCols.length)];
    p.className='particle';
    p.style.cssText=`width:${size}px;height:${size}px;background:${col};border-radius:50%;left:${Math.random()*100}%;bottom:-20px;position:absolute;animation-name:particlefloat;animation-timing-function:linear;animation-iteration-count:infinite;animation-duration:${6+Math.random()*12}s;animation-delay:${Math.random()*8}s;`;
    c.appendChild(p);
  }
}
makePurpleParticles('blog-particles', 75);

</script>
