<!DOCTYPE html>
<html lang="it">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
:root{--green:#8CFF00;--purple:#B58CFF;--lime:#E6FF4D;--dark:#0D0D0F;--dark2:#111116;--mid:#1E1E24;--cream:#F7F4EE;--text-d:#F5F5F7;--text-l:#1A1A1E;--muted-d:rgba(245,245,247,.6);--fd:'Orbitron',sans-serif;--fb:'Exo 2',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--text-d);font-family:var(--fb);line-height:1.7;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:820px;margin:0 auto;padding:0 1.25rem;}
nav{position:sticky;top:0;z-index:50;background:rgba(13,13,15,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(140,255,0,.1);padding:.9rem 1.25rem;display:flex;justify-content:space-between;align-items:center;}
.nlogo{font-family:var(--fd);font-size:.85rem;letter-spacing:3px;}
.nlogo em{color:var(--green);font-style:normal;}
nav ul{list-style:none;display:flex;gap:1.2rem;font-size:.7rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;}
nav a:hover{color:var(--green);}
.breadcrumb{font-size:.7rem;color:var(--muted-d);margin:1.2rem 0 .6rem;letter-spacing:1px;}
.breadcrumb a:hover{color:var(--green);}
.article-header{padding:1.5rem 0 1rem;}
.cat{color:var(--purple);font-size:.7rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;}
h1{font-family:var(--fd);font-size:clamp(1.7rem,5vw,3rem);line-height:1.05;margin:.6rem 0 1rem;}
.meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:.75rem;color:var(--muted-d);margin-bottom:1.2rem;}
.cover{width:100%;border-radius:16px;overflow:hidden;margin:1rem 0 1.6rem;background:var(--mid);aspect-ratio:16/9;}
.cover img{width:100%;height:100%;object-fit:cover;display:block;}
.tldr{background:linear-gradient(135deg,rgba(140,255,0,.08),rgba(181,140,255,.08));border:1px solid rgba(140,255,0,.2);border-radius:14px;padding:1.2rem 1.3rem;margin:1.4rem 0 2rem;}
.tldr h2{font-family:var(--fd);font-size:.9rem;letter-spacing:2px;margin-bottom:.5rem;color:var(--green);}
.tldr ul{padding-left:1.2rem;}
.tldr li{margin:.25rem 0;font-size:.9rem;}
article .content{font-size:1rem;}
article .content h2{font-family:var(--fd);font-size:1.5rem;margin:2rem 0 .8rem;color:var(--green);}
article .content h3{font-size:1.2rem;margin:1.6rem 0 .6rem;color:var(--purple);}
article .content p{margin:.8rem 0;color:var(--text-d);}
article .content ul,article .content ol{margin:.8rem 0 1rem 1.4rem;}
article .content img{max-width:100%;border-radius:12px;margin:1rem 0;}
article .content blockquote{border-left:3px solid var(--purple);padding:.6rem 1rem;margin:1rem 0;color:var(--muted-d);background:rgba(181,140,255,.05);}
article .content code{background:var(--mid);padding:.15rem .4rem;border-radius:4px;font-size:.9rem;}
.tags{display:flex;gap:.4rem;flex-wrap:wrap;margin:1.5rem 0;}
.tag{padding:.3rem .7rem;border-radius:999px;border:1px solid rgba(181,140,255,.3);font-size:.7rem;color:var(--purple);}
.loading,.error{padding:3rem 1rem;text-align:center;color:var(--muted-d);}

.article-nav{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:space-between;margin-top:2.2rem;padding-top:1.2rem;border-top:1px solid rgba(255,255,255,.08);}
.nav-btn{padding:.75rem 1rem;border-radius:10px;border:1px solid rgba(140,255,0,.3);color:var(--green);font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:.75rem;transition:.2s;background:rgba(140,255,0,.05);}
.nav-btn:hover{background:var(--green);color:var(--dark);}
.nav-btn.next{border-color:rgba(181,140,255,.35);color:var(--purple);background:rgba(181,140,255,.05);}
.nav-btn.next:hover{background:var(--purple);color:var(--dark);}
.nav-btn.game{border-color:rgba(140,255,0,.45);color:var(--green);background:rgba(140,255,0,.08);}
.nav-btn.game:hover{background:var(--green);color:var(--dark);}

footer{border-top:1px solid rgba(255,255,255,.06);padding:2rem 0;color:var(--muted-d);font-size:.8rem;text-align:center;}
@media(max-width:640px){h1{font-size:1.8rem;}}

/* ── Purple neon particles & plants ── */
#blog-particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.plant{position:absolute;pointer-events:none;z-index:1;}
.plant.purple-leaf{filter:hue-rotate(225deg) saturate(1.45) brightness(1.08);}
@keyframes particlefloat{0%{transform:translateY(0) rotate(0deg);opacity:0;}10%{opacity:.9;}90%{opacity:.7;}100%{transform:translateY(-120vh) rotate(720deg);opacity:0;}}
@keyframes sway{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
@keyframes swayr{0%,100%{transform:scaleX(-1) rotate(-6deg);}50%{transform:scaleX(-1) rotate(6deg);}}
@keyframes leafbob{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-8px) rotate(3deg);}}
.particle{position:absolute;border-radius:50%;pointer-events:none;animation:particlefloat linear infinite;}
nav,main,.wrap,footer,.article-nav,.article-header{position:relative;z-index:2;}

</style>
</head>
<body>

<div id="blog-particles"></div>
<svg width="0" height="0" style="position:absolute;" aria-hidden="true"><defs>

  <path d="M62 135 Q34 125 26 115 Q36 112 56 128Z" fill="#4A8C3F"/>
  <path d="M62 105 Q36 95 28 85 Q38 82 56 98Z" fill="#3A7334"/>
  <path d="M62 75 Q34 65 26 55 Q36 52 56 68Z" fill="#4A8C3F"/>
  <path d="M62 48 Q36 38 28 28 Q38 25 56 42Z" fill="#3A7334"/>

</symbol>

</symbol>

<svg class="plant purple-leaf" width="180" height="260" style="top:-20px;right:-30px;opacity:.35;animation:sway 9s ease-in-out infinite;transform-origin:bottom center;"><use href="#lf-mon"/></svg>
<svg class="plant purple-leaf" width="140" height="220" style="bottom:-10px;left:-20px;opacity:.3;animation:swayr 11s ease-in-out infinite;transform-origin:bottom center;"><use href="#lf-trop"/></svg>

    <li><a href="index.html#appt">Prenota</a></li>

</nav>
<div class="wrap">
  <div class="breadcrumb"><a href="index.html">Home</a> / <a href="blog.html">Blog</a> / <span id="bc-title">Articolo</span></div>
  <div id="wrap">
    <div class="loading">Caricamento articolo…</div>
  </div>
</div>
<footer>© 2025 WooDreads – Roma & Provincia</footer>

<script>
const DEFAULT_POST = {
  id:'default-guida',
  slug:'guida-manutenzione-dreads-naturali-roma',
  title:"Guida definitiva alla manutenzione dei dreadlocks naturali a Roma: come curarli senza cera",
  category:{name:'Manutenzione'},
  excerpt:"Scopri come lavare, idratare, proteggere e prevenire odori o frizz senza usare cera. Una guida editoriale step-by-step per mantenere i tuoi dreadlocks naturali sani, puliti e perfettamente ordinati con il metodo WooDreads.",
  coverImage:{url:"https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=1200&q=80"},
  publishedAt:"2026-01-15T09:00:00.000Z",
  readingTime:6,
  content:`<h2>Perché evitare la cera</h2><p>La cera rende i dreadlocks pesanti, pastosi e difficili da lavare. Nel metodo WooDreads la manutenzione si basa su acqua controllata, shampoo delicato, palm rolling e routine settimanale.</p><img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=1200&q=80" alt="Manutenzione dreadlocks naturali" loading="lazy"/><h3>Lavaggio corretto</h3><p>Usa uno shampoo leggero due volte, risciacqua abbondantemente e tampona con microfibra. Non coprire il lavoro con prodotti pesanti: l\'aria e il movimento fissano la struttura.</p><div style="margin:1.2rem 0;"><img src="https://media.giphy.com/media/3o7TKB3IUHuOqQVdWU/giphy.gif" alt="Mini video loop cura dreadlocks" style="max-width:100%;border-radius:12px;"/><p style="font-size:.75rem;color:var(--muted-d);margin-top:.4rem;">Loop stile GIF — cura e manipolazione leggera.</p></div><h2>Anteprima video YouTube</h2><p>Durante la manutenzione osserva sempre il movimento naturale dei dread: tensione uniforme, radice pulita e nessun accumulo.</p><div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:16px;margin:1.2rem 0;"><iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&loop=1&playlist=dQw4w9WgXcQ" title="Anteprima YouTube" frameborder="0" allow="autoplay;encrypted-media" style="position:absolute;inset:0;width:100%;height:100%;"></iframe></div><h3>Routine settimanale</h3><ul><li>Giorno 1: lavaggio delicato.</li><li>Giorno 2: asciugatura completa all\'aria.</li><li>Giorno 4: idratazione leggera.</li><li>Giorno 7: controllo radice e palm rolling.</li></ul><p>Con costanza otterrai dreadlocks lucidi, ordinati e senza cera, con meno stress per capelli e scalp.</p>`
};

const API = '/.netlify/functions/blog';
const wrap = document.getElementById('wrap');
const params = new URLSearchParams(location.search);
const slug = params.get('slug');

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function sanitizeHtml(html){ // basic XSS guard
  if(!html) return '';
  return String(html)
    .replace(/<script[\s\S]*?<\/script>/gi,'')
    .replace(/on\w+\s*=\s*(".*?"|'.*?'|[^\s>]+)/gi,'')
    .replace(/javascript:/gi,'');
}
function imgUrl(img,size){
  if(!img||!img.url) return '';
  const base = img.url.startsWith('http')?'':(API.replace(/\/[^/]+$/,''));
  if(size && img.formats && img.formats[size]) return base+img.formats[size].url;
  return base+img.url;
}
function formatDate(iso){try{return new Date(iso).toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});}catch(e){return '';}}
function setMeta(name,content,attr='name'){
  if(!content) return;
  let el = document.querySelector('meta['+attr+'="'+name+'"]');
  if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}
function injectJsonLd(obj){
  let s = document.getElementById('jsonld-article');
  if(!s){s=document.createElement('script');s.type='application/ld+json';s.id='jsonld-article';document.head.appendChild(s);}
  s.textContent = JSON.stringify(obj);
}

function renderPost(post){
  if(!post){
    wrap.innerHTML='<div class="error">Articolo non trovato.</div>';return;
  }
  try{
    const title = post.seoTitle || post.title;
    const description = post.seoDescription || post.excerpt || '';
    const cover = imgUrl(post.coverImage,'large') || imgUrl(post.coverImage);
    const ogImg = imgUrl(post.ogImage,'large') || cover;
    const category = post.category?.data?.attributes?.name || post.category?.name || '';
    const tags = (post.tags||[]).map(t=>t.name||t).filter(Boolean);
    const published = post.publishedAt || post.createdAt;
    const modified = post.updatedAt || published;
    const url = location.origin + location.pathname + '?slug=' + encodeURIComponent(slug);
    const author = post.authorName || 'WooDreads';

    // Dynamic SEO meta
    document.title = title + ' — Blog WooDreads';
    setMeta('description', description);
    setMeta('og:title', title, 'property');
    setMeta('og:description', description, 'property');
    setMeta('og:url', url, 'property');
    setMeta('og:image', ogImg, 'property');
    setMeta('og:type', 'article', 'property');
    setMeta('article:published_time', published, 'property');
    setMeta('article:modified_time', modified, 'property');
    setMeta('article:author', author, 'property');
    if(category) setMeta('article:section', category, 'property');
    setMeta('twitter:title', title);
    setMeta('twitter:description', description);
    setMeta('twitter:image', ogImg);
    const canonical = document.querySelector('link[rel="canonical"]');
    if(canonical) canonical.setAttribute('href', url);
    document.getElementById('bc-title').textContent = post.title;

    // Derive TL;DR (first 3 sentences of excerpt/content text)
    const excerpt = post.excerpt || '';
    const tldrItems = excerpt.split(/[.!?]\s+/).filter(Boolean).slice(0,3);

    const jsonLd = {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": post.title,
      "description": description,
      "image": ogImg ? [ogImg] : undefined,
      "author": {"@type":"Person","name":author},
      "publisher": {"@type":"Organization","name":"WooDreads","logo":{"@type":"ImageObject","url":location.origin+"/logo.svg"}},
      "datePublished": published,
      "dateModified": modified,
      "mainEntityOfPage": {"@type":"WebPage","@id":url},
      "articleSection": category || undefined,
      "keywords": tags.length ? tags.join(', ') : undefined,
      "wordCount": (post.content||'').replace(/<[^>]+>/g,'').split(/\s+/).length
    };
    // remove undefined
    Object.keys(jsonLd).forEach(k=>jsonLd[k]===undefined && delete jsonLd[k]);

    wrap.innerHTML =
      '<article>'+
      '<header class="article-header">'+
      (category?'<div class="cat">'+esc(category)+'</div>':'')+
      '<h1>'+esc(post.title)+'</h1>'+
      '<div class="meta"><span>'+formatDate(published)+'</span><span>'+author+'</span>'+(post.readingTime?'<span>'+post.readingTime+' min lettura</span>':'')+'</div>'+
      '</header>'+
      (cover?'<div class="cover"><img src="'+cover+'" alt="'+esc(post.title)+'" loading="eager" decoding="async"/></div>':'')+
      (tldrItems.length?'<section class="tldr" aria-label="Sommario"><h2>📌 In sintesi (TL;DR)</h2><ul>'+tldrItems.map(x=>'<li>'+esc(x.trim())+(x.trim().endsWith('.')?'':' .')+'</li>').join('')+'</ul></section>':'')+
      '<section class="content">'+sanitizeHtml(post.content||'')+'</section>'+
      (tags.length?'<div class="tags">'+tags.map(t=>'<span class="tag">#'+esc(t)+'</span>').join('')+'</div>':'')+
      '<nav class="article-nav" aria-label="Navigazione articoli">'+
      '<a class="nav-btn" href="blog.html">← Torna al blog</a>'+
      '<a class="nav-btn game" href="index.html#quiz">🎮 Mini-Game</a>'+
      '<a class="nav-btn next" href="blog.html">Prossimo articolo →</a>'+
      '</nav>'+
      '</article>';

    injectJsonLd(jsonLd);
  }catch(e){
    wrap.innerHTML='<div class="error">Errore nel caricamento dell\'articolo. Riprova più tardi.</div>';
  }
}
async function render(){
  if(!slug){
    wrap.innerHTML='<div class="error">Slug articolo mancante.</div>';return;
  }
  if(slug === DEFAULT_POST.slug){ renderPost(DEFAULT_POST); return; }
  try{
    const r = await fetch(API+'/post?slug='+encodeURIComponent(slug));
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    const items = d.data||d||[];
    if(!items.length){ wrap.innerHTML='<div class="error">Articolo non trovato.</div>'; return; }
    const raw = items[0];
    const post = raw.attributes ? {id:raw.id,...raw.attributes} : raw;
    renderPost(post);
  }catch(e){
    wrap.innerHTML='<div class="error">Errore nel caricamento dell\'articolo. Riprova più tardi.</div>';
  }
}

render();

const purpleCols = ['rgba(181,140,255,.9)','rgba(255,107,241,.85)','rgba(230,180,255,.75)','rgba(181,140,255,.55)','rgba(255,255,255,.4)'];
function makePurpleParticles(containerId,count){
  const c=document.getElementById(containerId); if(!c) return;
  c.style.cssText='position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;';
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    const size=Math.random()*5+2;
    const col=purpleCols[Math.floor(Math.random()*purpleCols.length)];
    p.className='particle';
    p.style.cssText=`width:${size}px;height:${size}px;background:${col};border-radius:50%;left:${Math.random()*100}%;bottom:-20px;position:absolute;animation-name:particlefloat;animation-timing-function:linear;animation-iteration-count:infinite;animation-duration:${6+Math.random()*12}s;animation-delay:${Math.random()*8}s;`;
    c.appendChild(p);
  }
}
makePurpleParticles('blog-particles', 75);

</script>
</body>
</html>
