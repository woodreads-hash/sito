version: '3.8'

services:
  # --- DATABASE: PostgreSQL 15 ---
  strapi-db:
    image: postgres:15-alpine
    container_name: strapi-db
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapipassword}
      POSTGRES_DB: ${DATABASE_NAME:-strapi_database}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rete-virtuale
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi} -d ${DATABASE_NAME:-strapi_database}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- BACKEND: Strapi CMS (Node.js) ---
  strapi-backend:
    container_name: strapi-backend
    build:
      context: ./backend
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${APP_KEYS:-testKey1,testKey2}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-salt12345}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-adminSecret12345}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-transferSalt123}
      JWT_SECRET: ${JWT_SECRET:-jwtSecret123}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: strapi-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-strapi_database}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapipassword}
    volumes:
      - ./backend:/opt/app
      - /opt/app/node_modules
    ports:
      - "1337:1337"
    depends_on:
      strapi-db:
        condition: service_healthy
    networks:
      - rete-virtuale

  # --- FRONTEND: Web Server Nginx ---
  frontend-server:
    image: nginx:alpine
    container_name: frontend-server
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "8080:80"
    networks:
      - rete-virtuale
    depends_on:
      - strapi-backend

networks:
  rete-virtuale:
    driver: bridge

volumes:
  postgres_data:
